<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/styles/coming-soon.css?v=3">

    <title>Ambition IT | Coming Soon 2027</title>
    <meta name="description" content="The new Ambition IT website is coming in 2027.">
</head>

<body>
    <main class="coming-page">
        <div class="background-circle circle-one" aria-hidden="true"></div>
        <div class="background-circle circle-two" aria-hidden="true"></div>

        <section class="coming-content">
            <div class="coming-logo">
                <img
                    src="/imgs/ambition-it-logo-transparent-cropped.png"
                    alt="Ambition IT"
                >
            </div>

            <p class="coming-brand">AMBITION IT</p>

            <h1>
                Coming Soon
                <span>2027</span>
            </h1>

            <div class="progress-area">
                <div class="progress-details">
                    <span>Website progress</span>
                    <strong id="progress-number">0%</strong>
                </div>

                <div
                    class="progress-track"
                    id="progress-track"
                    role="progressbar"
                    aria-label="Website development progress"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="0"
                >
                    <span class="progress-fill" id="progress-fill"></span>
                </div>
            </div>
        </section>

        <p class="coming-footer">
            Stowmarket, Suffolk · Ambition IT
        </p>
    </main>

    <script src="/Javascript/coming-soon.js?v=3" defer></script>
</body>
</html>
